<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>基于Java的摄影曝光教学与仿真平台</title>
    <link rel="stylesheet" href="css/simulator.css">
</head>
<body>

    <h2>曝光三要素仿真</h2>
    <canvas id="photoCanvas"></canvas>
    <br>
    
    <div class="controls">
        <div class="control-group">
            <label>光圈 (F):</label>
            <input type="range" id="apertureSlider" min="0" max="5" step="1" value="2">
            <span class="value-display" id="apertureVal">f/8</span>
        </div>
        <div class="control-group">
            <label>快门 (S):</label>
            <input type="range" id="shutterSlider" min="0" max="10" step="1" value="5">
            <span class="value-display" id="shutterVal">1/125</span>
        </div>
        <div class="control-group">
            <label>ISO:</label>
            <input type="range" id="isoSlider" min="0" max="6" step="1" value="0">
            <span class="value-display" id="isoVal">100</span>
        </div>
    </div>

    <div class="histogram-container">
        <p style="margin: 5px 0; font-size: 14px; color: #bdc3c7;">实时曝光直方图 (左: 暗部 | 右: 亮部)</p>
        <canvas id="histogramCanvas" width="256" height="100"></canvas>
    </div>

    <script src="js/simulator.js"></script>
</body>
</html>
